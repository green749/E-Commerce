name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Server Quality & Test Suite
  # ============================================================================
  server-ci:
    name: Server Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Test Suite (Vitest with PGlite)
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_ACCESS_SECRET: test_jwt_access_secret_min_32_characters_long_12345
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_min_32_characters_long_12345

  # ============================================================================
  # 2. Client Quality & Production Build
  # ============================================================================
  client-ci:
    name: Client Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_API_URL: /api

  # ============================================================================
  # 3. Docker Verification
  # ============================================================================
  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: [server-ci, client-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Container
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: ecommerce-server:ci

      - name: Build Client Container
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: ecommerce-client:ci
          build-args: |
            VITE_API_URL=/api
